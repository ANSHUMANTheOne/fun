<body>

<h2>Calculator</h2>

<!-- Inputs for the user -->

<input id="num1" type="text" placeholder="First number">

<input id="num2" type="text" placeholder="Second number">

<select id="mathSign">

<option value="plus">+</option>

<option value="minus">-</option>

<option value="times">*</option>

<option value="divide">/</option>

</select>

<button onclick="calculate()">Calculate</button>

<!-- This is where the answer shows up -->

<p id="answerText">Result: </p>

<script>

function calculate() {

// Getting the numbers from the inputs
var n1 = document.getElementById("num1").value;

var n2 = document.getElementById("num2").value;

var sign = document.getElementById("mathSign").value;

// turning them into numbers

// ty chatgpt for parseint

var x = parseInt(n1);

var y = parseInt(n2);


var result = 0;



if (sign == "plus") {

result = x + y;

}

if (sign == "minus") {

result = x - y;

}

if (sign == "times") {

result = x * y;

}

if (sign == "divide") {

result = x / y;

}

// outputting the result

document.getElementById("answerText").innerHTML = "Result: " + result;


// I left this here to make sure the button actually clicks

console.log("It worked!");
}

</script>

</body>

</html>
