<html>

<title>my super awesome calculator which did not ragebait me at all :)</title>
<style>

body{
font-family:system-ui;
background:#f2f2f2;
text-align:center;
margin-top:20px;
transition:background 0.5s;
overflow:hidden;
}

.calculator{
background:white;
width:360px;
margin-top:20px;
margin-right:auto;
margin-bottom:20px;
margin-left:auto;
padding:25px;
border-radius:12px;
box-shadow:0px 8px 20px #cccccc;
position:relative;
z-index:5;
}
h2{
margin-bottom:20px;
}

input,select{
width:85%;
padding:10px;
margin-top:8px;
margin-right:8px;
margin-bottom:8px;
margin-left:8px;
font-size:16px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:7px;
}

button{
padding:10px;
margin-top:6px;
margin-right:6px;
margin-bottom:6px;
margin-left:6px;
font-size:16px;
background:#333;
color:white;
border:0;
border-radius:7px;
cursor:pointer;
}

button:hover{
background:#555;
}

#clear{
background:#888;
}

#answerText{
font-size:21px;
margin-top:20px;
}

#history{
font-size:14px;
text-align:left;
margin-top:20px;
max-height:180px;
overflow-y:auto;
}
#artLayer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
overflow:hidden;
}

.art{
position:absolute;
font-family:monospace;
white-space:pre;
opacity:0.16;
color:#333;
}

#popup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:20px;
border-radius:15px;
box-shadow:0px 10px 30px #999;
width:320px;
z-index:10;
}
#popup img,
#popup video{
width:270px;
max-height:250px;
border-radius:10px;
}

#popupText{
font-size:19px;
font-weight:bold;
margin-top:20px;
}

</style>

</head>

<div id="artLayer"></div>

<div class="calculator">

<h2>my Calculator</h2>

<input id="num1" type="number" placeholder="first number">

<input id="num2" type="number" placeholder="second number">

<select id="mathSign">

<option value="plus">+</option>
<option value="minus">-</option>
<option value="times">*</option>
<option value="divide">/</option>

</select>

<br>

<button onclick="calculate()">Calculate</button>

<button id="clear" onclick="clearCalculator()">Clear</button>

<p id="answerText">result:</p>

<p id="last">last calculation:</p>

<div id="history">

<p>history:</p>

</div>

</div>


<div id="popup">

<p id="popupText"></p>

<div id="media"></div>

<pre id="specialAscii"></pre>

<button onclick="closePopup()">close</button>

</div>

"enter both numbers"

return

var x = parseFloat(n1)

var answer = 0
var symbol = ""

answer = x + y
symbol = "+"

}

answer = x - y

}

answer = x * y
symbol = "*"

}

if(y == 0){

var top = Math.floor(Math.random() * 70)

Math.floor(Math.random() * 5 + 7) + "px"

}

function showSpecial(text,media,ascii){

document.getElementById("popupText").innerHTML = text

document.getElementById("specialAscii").innerHTML = ascii

var area = document.getElementById("media")

area.innerHTML = ""

if(media != ""){

if(media.includes(".mp4")){

area.innerHTML =
'<video src="' + media + '" autoplay loop controls></video>'

}

else{

area.innerHTML =
'<img src="' + media + '">'

}

}

document.getElementById("popup").style.display = "block"

}


function closePopup(){
